# ============================================================
# 放置位置：orders-system repo 底下的
#           .github/workflows/sync-to-tool-system.yml
#
# 功能：orders-system 的 main branch 一有 push，就自動把根目錄下所有
#       *.py 檔案（env.py 除外，見下方說明）複製一份到 tool-system repo
#       的 tools/orders_system/ 目錄，自動 commit + push，觸發
#       Streamlit Cloud 自動重新部署。
#
#       之後在 orders-system 根目錄新增任何 .py 檔案，不需要再手動修改
#       這支 workflow，push 到 main 就會自動一起同步過去。
#
# 為什麼 env.py 要排除：
#       env.py 裡面有正式環境用的金鑰（例如 GOOGLE_MAPS_API_KEY），
#       tool-system 是 public repo，不能把金鑰帶過去。tool-system 那邊
#       的 env.py 是手動維護的獨立版本，不受這支 workflow 影響。
#
# 為什麼 memo_system/ 目錄不在這支 workflow 的同步範圍：
#       memo_system 在 tool-system 那邊是用「墊片檔案」轉接到
#       tools/memo_system 的獨立模組，維護方式不一樣，這支 workflow
#       只處理根目錄的 .py 檔案，不會動到子目錄。
#
# 事前準備（只需要做一次）：
# 1. 到 GitHub → 右上角頭像 → Settings → Developer settings →
#    Personal access tokens → Fine-grained tokens，建立一個新 token，
#    只勾選 tool-system 這個 repo 的 Contents: Read and write 權限。
# 2. 到 orders-system repo → Settings → Secrets and variables →
#    Actions → New repository secret，
#    Name 填 TOOL_SYSTEM_PUSH_TOKEN，Value 貼上剛剛的 token。
# ============================================================
name: Sync ordersapp to tool-system

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "!env.py"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orders-system（來源）
        uses: actions/checkout@v4
        with:
          path: orders-system

      - name: Checkout tool-system（目的地）
        uses: actions/checkout@v4
        with:
          repository: jenny-smart/tool-system
          token: ${{ secrets.TOOL_SYSTEM_PUSH_TOKEN }}
          path: tool-system

      - name: 複製檔案到 tool-system/tools/orders_system/
        run: |
          set -e
          mkdir -p tool-system/tools/orders_system

          # 同步根目錄下所有 .py 檔案，env.py 是唯一手動排除的例外
          # （裡面有正式金鑰，見上方檔頭說明）。
          for f in orders-system/*.py; do
            name="$(basename "$f")"
            if [ "$name" = "env.py" ]; then
              echo "⏭️ 略過 env.py（手動維護，含金鑰，不同步）"
              continue
            fi
            cp "$f" "tool-system/tools/orders_system/$name"
            echo "已複製：$name"
          done

      - name: 檢查是否有變動
        id: diff
        run: |
          cd tool-system
          git add tools/orders_system
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit 並 push 到 tool-system
        if: steps.diff.outputs.changed == 'true'
        run: |
          cd tool-system
          git config user.name "orders-system-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "🔄 自動同步 orders-system → $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
