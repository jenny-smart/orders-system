name: Patch Cloud Batch Menu
on:
  push:
    branches: [feature/cloud-batch-finalize-menu]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloud-batch-finalize-menu
      - name: Patch ordersapp.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ordersapp.py')
          s = p.read_text()
          old = 'import batch_booking_optimized\nimport reserve_menu'
          new = 'import batch_booking_optimized\nimport cloud_batch_finalize_ui\nimport reserve_menu'
          if old not in s:
              raise SystemExit('import anchor not found')
          s = s.replace(old, new, 1)
          old = '''    ("批次建單優化：會員一次選日期區間與多個時段，集中查班後批次建立訂單。",\n     "orders", "批次建單優化"),'''
          new = old + '''\n    ("批次建單優化＋雲端批次成單：沿用優化核心，在雲端背景持續成單直到完成。",\n     "orders", "批次建單優化＋雲端批次成單"),'''
          if old not in s:
              raise SystemExit('menu anchor not found')
          s = s.replace(old, new, 1)
          old = '''if mode == "批次建單優化":\n    batch_booking_optimized.render(backend_email, backend_password, env)\n    st.stop()'''
          new = old + '''\n\nif mode == "批次建單優化＋雲端批次成單":\n    cloud_batch_finalize_ui.render()\n    st.stop()'''
          if old not in s:
              raise SystemExit('route anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ordersapp.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: expose cloud batch finalize as independent menu"
          git push
