name: Temp patch ATM unpaid writer

on:
  push:
    branches: [fix/atm-unpaid-status-dedupe]
    paths:
      - ".github/workflows/_temp_patch_atm.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atm-unpaid-status-dedupe
          fetch-depth: 0

      - name: Patch ATM unpaid writer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('memo_system/atm.py')
          text = path.read_text()

          old = '''    # 新增位置仍以 A 欄最後一筆＋5 列定位；B 欄只決定重複檢查範圍。\n    last_a_row = max(\n        (idx for idx, row in enumerate(all_values, start=1)\n         if row and str(row[0]).strip()),\n        default=0,\n    )\n    last_b_row = max(\n        (idx for idx, row in enumerate(all_values, start=1)\n         if len(row) >= 2 and str(row[1]).strip()),\n        default=1,\n    )\n\n    existing_order_nos = set()\n    last_unpaid_row = 0\n    for idx, row in enumerate(all_values, start=1):\n        if idx <= last_b_row:\n            continue\n        i_to_l = row[8:12] if len(row) > 8 else []\n        if any(str(value).strip() for value in i_to_l):\n            last_unpaid_row = idx\n        order_no = row[9] if len(row) > 9 else ""\n        if str(order_no).strip():\n            existing_order_nos.add(str(order_no).strip())\n'''

          new = '''    # 新增位置以 A 欄最後一筆＋5 列定位；去重只檢查 A 欄最後一筆以下的 J 欄。\n    last_a_row = max(\n        (idx for idx, row in enumerate(all_values, start=1)\n         if row and str(row[0]).strip()),\n        default=0,\n    )\n\n    existing_order_nos = set()\n    last_unpaid_row = 0\n    for idx, row in enumerate(all_values, start=1):\n        if idx <= last_a_row:\n            continue\n        i_to_l = row[8:12] if len(row) > 8 else []\n        if any(str(value).strip() for value in i_to_l):\n            last_unpaid_row = idx\n        order_no = row[9] if len(row) > 9 else ""\n        if str(order_no).strip():\n            existing_order_nos.add(str(order_no).strip())\n'''

          if old not in text:
              raise SystemExit('target dedupe block not found')
          text = text.replace(old, new, 1)

          old2 = '''    updates = []\n    for offset, row in enumerate(pending_rows):\n        row_num = start_row + offset\n        updates.append({\n            "range": f"I{row_num}:L{row_num}",\n            "values": [[\n                row["year_month"],\n                row["order_no"],\n                row["name"],\n                row["net_amount"],\n            ]],\n        })\n\n        # H 欄 LINE 連結只在原儲存格為空時寫入，避免覆蓋人工資料。\n'''

          new2 = '''    updates = []\n    pasted_at = _now_text()\n    for offset, row in enumerate(pending_rows):\n        row_num = start_row + offset\n        updates.append({\n            "range": f"I{row_num}:L{row_num}",\n            "values": [[\n                row["year_month"],\n                row["order_no"],\n                row["name"],\n                row["net_amount"],\n            ]],\n        })\n        updates.append({"range": f"P{row_num}", "values": [[pasted_at]]})\n        updates.append({"range": f"T{row_num}", "values": [["待對帳"]]})\n\n        # H 欄 LINE 連結只在原儲存格為空時寫入，避免覆蓋人工資料。\n'''

          if old2 not in text:
              raise SystemExit('target write block not found')
          text = text.replace(old2, new2, 1)

          text = text.replace(
              '    """將未出現的待付款訂單接在 B 欄資料區下方，不覆蓋既有 I:L。"""',
              '    """新增未出現的待付款訂單；J 欄去重範圍為 A 欄最後資料列以下，並回填 P/T。"""',
              1,
          )

          path.write_text(text)
          PY

          python -m py_compile memo_system/atm.py

      - name: Commit patch and remove temp workflow
        shell: bash
        run: |
          rm .github/workflows/_temp_patch_atm.yml
          git config user.name "chatgpt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add memo_system/atm.py .github/workflows/_temp_patch_atm.yml
          git commit -m "fix: ATM 待付款去重並回填 P/T"
          git push origin HEAD:fix/atm-unpaid-status-dedupe
