name: Batch Finalize Orders

on:
  workflow_dispatch:
    inputs:
      sheet_name:
        description: "工作表分頁名稱，例如台北202609"
        required: true
        type: string
      max_rows:
        description: "最多處理列數；0 = 跑到沒有待成單資料"
        required: false
        default: "0"
        type: string
      chunk_size:
        description: "每輪最多抓幾列"
        required: false
        default: "50"
        type: string

concurrency:
  group: batch-finalize-orders-prod
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      TAIPEI_EMAIL: ${{ secrets.TAIPEI_EMAIL }}
      TAIPEI_PASSWORD: ${{ secrets.TAIPEI_PASSWORD }}
      TAICHUNG_EMAIL: ${{ secrets.TAICHUNG_EMAIL }}
      TAICHUNG_PASSWORD: ${{ secrets.TAICHUNG_PASSWORD }}
      TAOYUAN_EMAIL: ${{ secrets.TAOYUAN_EMAIL }}
      TAOYUAN_PASSWORD: ${{ secrets.TAOYUAN_PASSWORD }}
      HSINCHU_EMAIL: ${{ secrets.HSINCHU_EMAIL }}
      HSINCHU_PASSWORD: ${{ secrets.HSINCHU_PASSWORD }}
      KAOHSIUNG_EMAIL: ${{ secrets.KAOHSIUNG_EMAIL }}
      KAOHSIUNG_PASSWORD: ${{ secrets.KAOHSIUNG_PASSWORD }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Finalize pending orders
        run: >-
          python batch_finalize_orders.py
          --sheet "${{ inputs.sheet_name }}"
          --env prod
          --chunk-size "${{ inputs.chunk_size }}"
          --max-rows "${{ inputs.max_rows }}"
