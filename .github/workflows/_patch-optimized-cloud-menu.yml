name: Patch Optimized Cloud Menu
on:
  push:
    branches: [feature/rebuild-optimized-cloud-batch-v2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rebuild-optimized-cloud-batch-v2
      - name: Patch ordersapp.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ordersapp.py')
          s = p.read_text()
          if 'import cloud_batch_booking_ui' not in s:
              anchor = 'import batch_booking_optimized\nimport reserve_menu'
              if anchor not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(anchor, 'import batch_booking_optimized\nimport cloud_batch_booking_ui\nimport reserve_menu', 1)
          menu = '''    ("批次建單優化：會員一次選日期區間與多個時段，集中查班後批次建立訂單。",\n     "orders", "批次建單優化"),'''
          cloud_menu = '''    ("批次建單優化＋雲端批次成單：沿用批次優化核心，由雲端背景持續成單至完成。",\n     "orders", "批次建單優化＋雲端批次成單"),'''
          if cloud_menu not in s:
              if menu not in s:
                  raise SystemExit('menu anchor not found')
              s = s.replace(menu, menu + '\n' + cloud_menu, 1)
          route = '''if mode == "批次建單優化":\n    batch_booking_optimized.render(backend_email, backend_password, env)\n    st.stop()'''
          cloud_route = '''if mode == "批次建單優化＋雲端批次成單":\n    cloud_batch_booking_ui.render(env)\n    st.stop()'''
          if cloud_route not in s:
              if route not in s:
                  raise SystemExit('route anchor not found')
              s = s.replace(route, route + '\n\n' + cloud_route, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ordersapp.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: expose optimized cloud batch booking"
          git push
