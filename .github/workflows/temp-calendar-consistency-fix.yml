name: Temporary calendar consistency patch

on:
  push:
    branches:
      - fix/calendar-consistency-person-address

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-consistency-person-address

      - name: Patch calendar consistency logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          orders_path = Path("orders.py")
          s = orders_path.read_text(encoding="utf-8")

          s = replace_once(
              s,
              '# 版本：v2026.08.19-4\n# 模組：批次建單核心引擎（Google Sheet → 後台訂單，供 ordersapp.py 呼叫）\n# 最後更新：2026-08-19\n#\n# Change Log\n',
              '# 版本：v2026.09.05-1\n# 模組：批次建單核心引擎（Google Sheet → 後台訂單，供 ordersapp.py 呼叫）\n# 最後更新：2026-09-05\n#\n# Change Log\n# v2026.09.05-1\n# - 後台／Google 日曆雙向比對改為同一人＋同地址＋同日期＋同時段才可配對；移除只靠同時段補配。\n# - 後台同一區域、同一天、同一時段出現 2 筆以上訂單時，新增獨立異常群組並列出全部訂單。\n# - 找不到精確日曆事件時，改顯示同時段事件是否有同一人／同地址，避免「已被其他訂單配走」造成誤解。\n',
              'orders header version',
          )
          s = replace_once(
              s,
              'ORDERS_VERSION = "v2026.08.19-4"\nORDERS_UPDATED_AT = "2026-08-19"',
              'ORDERS_VERSION = "v2026.09.05-1"\nORDERS_UPDATED_AT = "2026-09-05"',
              'orders runtime version',
          )

          old = '''    def _event_phone_match(order_phone, event):
        phone_norm = normalize_phone(order_phone) if order_phone else ""
        return bool(phone_norm) and phone_norm in _event_blob(event)

    def _event_addr_core_match(order_address, event):
'''
          new = '''    def _event_phone_match(order_phone, event):
        phone_norm = normalize_phone(order_phone) if order_phone else ""
        return bool(phone_norm) and phone_norm in _event_blob(event)

    def _event_person_match(order, event):
        """同一人優先以電話判斷；後台缺電話時才退回姓名。"""
        phone_norm = normalize_phone(order.get("phone", "")) if order.get("phone") else ""
        blob = _event_blob(event)
        if phone_norm:
            return phone_norm in blob
        name_norm = normalize_text_for_parse(order.get("name", ""))
        return bool(name_norm) and name_norm in blob

    def _event_addr_core_match(order_address, event):
'''
          s = replace_once(s, old, new, 'event person helper')

          old = '''    matched_event_ids = set()
    result = {"backend_missing_in_calendar": [], "calendar_missing_in_backend": []}

    # ---------- 方向一：後台有、日曆沒有 ----------
'''
          new = '''    matched_event_ids = set()
    result = {
        "backend_duplicate_slots": [],
        "backend_missing_in_calendar": [],
        "calendar_missing_in_backend": [],
    }

    # 額外異常：同一區域、同一天、同一時段，後台系統有 2 筆以上訂單。
    # 依目前稽核規則，不論客人／地址是否相同，都要獨立列出供人工確認。
    backend_slot_groups = defaultdict(list)
    for order in backend_orders:
        backend_slot_groups[(order["region"], order["service_date"], order["service_time"])].append(order)
    for (slot_region, slot_date, slot_time), slot_orders in backend_slot_groups.items():
        if len(slot_orders) < 2:
            continue
        order_details = "；".join(
            f"{item['order_no']}（{item['name'] or '姓名不明'}／{item['address'] or '地址不明'}）"
            for item in slot_orders
        )
        result["backend_duplicate_slots"].append({
            "region": slot_region,
            "service_date": slot_date,
            "service_time": slot_time,
            "count": len(slot_orders),
            "order_nos": [item["order_no"] for item in slot_orders],
            "issue": (
                f"{slot_region}後台系統在 {slot_date} {slot_time} 有 {len(slot_orders)} 筆訂單："
                f"{order_details}。依目前稽核規則，同一天同一時段系統有 2 筆以上即列為異常，請確認。"
            ),
        })

    # ---------- 方向一：後台有、日曆沒有 ----------
'''
          s = replace_once(s, old, new, 'duplicate slot detection')

          old = '''            if _event_time_match(order, event) and (
                _event_phone_match(order["phone"], event)
                or _event_addr_core_match(order["address"], event)
            ):
'''
          new = '''            if (
                _event_time_match(order, event)
                and _event_person_match(order, event)
                and _event_addr_core_match(order["address"], event)
            ):
'''
          s = replace_once(s, old, new, 'exact calendar match')

          old = '''    # 第二輪：電話／地址都核對不上（或事件內容完全沒有可辨識資訊）的訂單，
    # 才用「同時段還沒被配走的事件」補配——此時才可能發生名不符實的配對，
    # 但至少不會搶走第一輪已經確認電話／地址相符的配對。
'''
          new = '''    # 第二輪：只處理第一輪沒有「同一人＋同地址＋同日期＋同時段」精確配對的訂單。
    # 禁止再拿同時段其他客人／其他地址的黃色事件補配。
'''
          s = replace_once(s, old, new, 'second pass comment')

          old = '''        candidates = [
            e for e in calendar_events_by_region.get(order["region"], [])
            if e.get("id") not in matched_event_ids and _event_time_match(order, e)
        ]
        if candidates:
            matched_event_ids.add(candidates[0].get("id"))
            continue

        # v2026.08.14：後台有這筆訂單，但這支電話整段期間內完全沒出現在該區域
        # 日曆的任何一筆事件裡（不限時段、不限顏色）——代表這位客人根本不是走
        # 日曆管理流程（例如電話沒登記進日曆、或這類客人本來就不會排進這個
        # 日曆），不列入比對範圍，避免誤報成「日曆沒有」。
        if not _phone_in_any_event(order["phone"], all_events_by_region.get(order["region"], [])):
            continue

'''
          s = replace_once(s, old, '', 'remove time-only fallback and phone skip')

          old = '''        if same_time_any_color:
            yellow_events = [e for e in same_time_any_color if str(e.get("colorId", "")) == COLOR_YELLOW]
            other_events = [e for e in same_time_any_color if str(e.get("colorId", "")) != COLOR_YELLOW]
            parts = []
            if yellow_events:
                parts.append(f"{len(yellow_events)} 筆是黃色，但同時段訂單數比黃色事件數多，已被其他訂單配走")
            if other_events:
                parts.append(f"{len(other_events)} 筆顏色不是黃色（{_color_breakdown(other_events)}）")
            extra = f"同時段在日曆上共找到 {len(same_time_any_color)} 筆事件：" + "；".join(parts) + "。"
        else:
            extra = "同時段在日曆上完全找不到任何事件。"
'''
          new = '''        if same_time_any_color:
            exact_identity_events = [
                e for e in same_time_any_color
                if _event_person_match(order, e) and _event_addr_core_match(order["address"], e)
            ]
            if exact_identity_events:
                exact_yellow = [e for e in exact_identity_events if str(e.get("colorId", "")) == COLOR_YELLOW]
                exact_other = [e for e in exact_identity_events if str(e.get("colorId", "")) != COLOR_YELLOW]
                if exact_yellow:
                    extra = (
                        f"同時段找到 {len(exact_yellow)} 筆同一人、同地址的黃色事件，"
                        "但該事件已對應到另一筆後台訂單；請確認後台是否重複成單。"
                    )
                else:
                    extra = (
                        f"同時段找到 {len(exact_identity_events)} 筆同一人、同地址事件，"
                        f"但顏色不是黃色（{_color_breakdown(exact_other)}）。"
                    )
            else:
                extra = (
                    f"同時段在日曆上共找到 {len(same_time_any_color)} 筆事件，"
                    "但沒有任何一筆同時符合此訂單的客人與地址"
                    f"（{_color_breakdown(same_time_any_color)}）。"
                )
        else:
            extra = "同時段在日曆上完全找不到任何事件。"
'''
          s = replace_once(s, old, new, 'calendar mismatch diagnostics')

          s = replace_once(
              s,
              '但後台這段期間的已付款訂單裡找不到服務日期／時段相符的訂單，',
              '但後台這段期間的已付款訂單裡找不到同一人／地址／服務日期／時段皆相符的訂單，',
              'calendar reverse issue text',
          )

          orders_path.write_text(s, encoding="utf-8")

          app_path = Path("ordersapp.py")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              '# 版本：v8.77\n# 模組：服務訂單系統主畫面\n# 最後更新：2026-08-14\n#\n# Change Log\n',
              '# 版本：v8.78\n# 模組：服務訂單系統主畫面\n# 最後更新：2026-09-05\n#\n# Change Log\n# v8.78\n# - 後台／Google 日曆雙向比對新增「系統同日同時段多筆」獨立異常區塊。\n# - 比對結果說明配合 orders.py 改為同一人＋同地址＋同日期＋同時段。\n',
              'ordersapp header version',
          )

          old = '''        _backend_missing = cc_result.get("backend_missing_in_calendar") or []
        _calendar_missing = cc_result.get("calendar_missing_in_backend") or []
        if not _backend_missing and not _calendar_missing:
'''
          new = '''        _backend_duplicates = cc_result.get("backend_duplicate_slots") or []
        _backend_missing = cc_result.get("backend_missing_in_calendar") or []
        _calendar_missing = cc_result.get("calendar_missing_in_backend") or []
        if not _backend_duplicates and not _backend_missing and not _calendar_missing:
'''
          app = replace_once(app, old, new, 'ordersapp result variables')

          old = '''        else:
            if _backend_missing:
                st.error(f"⚠️ 後台有、日曆沒有：{len(_backend_missing)} 筆")
'''
          new = '''        else:
            if _backend_duplicates:
                st.error(f"⚠️ 系統同日同時段多筆：{len(_backend_duplicates)} 組")
                for _p in _backend_duplicates:
                    st.warning(_p.get("issue", ""))
            if _backend_missing:
                st.error(f"⚠️ 後台有、日曆沒有：{len(_backend_missing)} 筆")
'''
          app = replace_once(app, old, new, 'ordersapp duplicate display')

          app_path.write_text(app, encoding="utf-8")

          # 靜態驗證：避免精準 patch 後仍殘留舊的跨客戶補配文字。
          assert 'backend_duplicate_slots' in s
          assert 'and _event_person_match(order, event)' in s
          assert 'and _event_addr_core_match(order["address"], event)' in s
          assert '已被其他訂單配走' not in s
          assert '系統同日同時段多筆' in app
          PY

      - name: Syntax check
        run: |
          python -m py_compile orders.py ordersapp.py

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orders.py ordersapp.py
          git diff --cached --check
          git commit -m "fix: tighten backend calendar consistency matching"
          git push origin HEAD:fix/calendar-consistency-person-address
