name: Temporary calendar consistency patch

on:
  push:
    branches:
      - fix/calendar-consistency-person-address

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-consistency-person-address
      - name: Apply patch
        run: python scripts/temp_calendar_fix.py
      - name: Syntax check
        run: python -m py_compile orders.py ordersapp.py
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orders.py ordersapp.py
          git diff --cached --check
          git commit -m "fix: tighten backend calendar consistency matching"
          git push origin HEAD:fix/calendar-consistency-person-address
